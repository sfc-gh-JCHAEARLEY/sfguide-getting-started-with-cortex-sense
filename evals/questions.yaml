# Evaluation questions for the Juniper Valley Health demo.
#
# 18 questions: 4 routine ones the schema can answer on its own, and 14 that need a
# definition, program rule, or policy that lives only in the KNOWLEDGE schema.
# Expected answers come from answer_key.sql and evals/golden_values.json (written by
# scripts/generate_data.py, which also checks that the numbers below match the data).
#
# You can give these to the Cortex Sense Accuracy tab as an evaluation run.

questions:
  # --- Routine: the schema is enough -------------------------------------------

  - id: r1
    kind: routine
    question: "What is our overall denial rate?"
    expected_answer: "12.1%: 379 distinct denied claims out of 3,131 claims. DENIALS is at claim line grain, so count DISTINCT claim_id. Counting rows gives 20.5%, which is wrong."

  - id: r2
    kind: routine
    question: "Which facilities participate in the ACO?"
    expected_answer: "Five: Juniper Valley Medical Center, Cedar Ridge Hospital, Willow Creek Hospital, Summit Orthopedic Hospital, and Northgate Family Clinic."

  - id: r3
    kind: routine
    question: "What share of billed charges have we been paid?"
    expected_answer: "58.4%: $15.93M paid of $27.26M billed, across all 3,131 claims."

  - id: r4
    kind: routine
    question: "Which payer do we send the most claims to?"
    expected_answer: "Medicare, with 798 of 3,131 claims, followed by UnitedHealthcare with 576."

  # --- Needs a definition from KNOWLEDGE ---------------------------------------

  - id: q1
    kind: needs_definition
    question: "What's our clean claim rate by payer?"
    expected_answer: "63.9% overall (2,001 of 3,131). A claim is clean only if submission_count = 1, claim_status = 'Paid', and it has no row in DENIALS. Best to worst: Self-Pay 72.7, Aetna 71.7, Blue Cross Blue Shield 70.9, Cigna 68.9, Humana 66.9, Medicare 65.2, Medicaid 54.6, UnitedHealthcare 54.2. UnitedHealthcare is last. Using submission_count = 1 alone gives 88.0% and ranks UnitedHealthcare first."
    source: knowledge/docs/Metrics_Glossary.md

  - id: q2
    kind: needs_definition
    question: "Show me our 30-day readmission rate"
    expected_answer: "10.5%: 62 qualifying readmissions over 590 eligible index admissions, below the CMS 18% threshold. Base population is inpatient encounters that aren't cancelled and have a discharge date; patients under 18 and obstetric admissions (any ICD-10 code starting with O) are excluded from the denominator; the numerator counts only unplanned readmissions within 30 days whose index admission is eligible. Dropping the 30-day rule gives 12.9%. Unplanned readmissions within 30 days over completed inpatient stays gives 20.3% (191 of 941), and every unplanned readmission over all 984 inpatient encounters gives 20.8% (205 of 984). Both wrongly cross the CMS threshold."
    source: knowledge/docs/Metrics_Glossary.md

  - id: q3
    kind: needs_definition
    question: "Which facilities have the BEACON designation?"
    expected_answer: "One: Summit Orthopedic Hospital. BEACON (Balanced Excellence Across Clinical Outcomes and Net revenue) requires all three of Experience Score >= 85, 30-day readmission rate < 8% using the house definition, and denial rate < 4%. Near misses: Cedar Ridge Hospital fails only readmission (9.2%), and Willow Creek Hospital fails only denial rate (23.0%)."
    source: knowledge/docs/BEACON_Facility_Designation.md

  - id: q4
    kind: needs_definition
    question: "What's our Tailwind rate?"
    expected_answer: "78.3%: 1,175 of 1,500 in-scope claims submitted within 24 hours of discharge, narrowly below the 80% target. Project Tailwind covers only ACO-participating facilities, for completed encounters with a discharge date. Across all facilities the same calculation gives 49.7%."
    source: knowledge/docs/Project_Tailwind.md

  - id: q5
    kind: needs_definition
    question: "An external benchmarking partner wants our facility-level 30-day readmission rates. Can I send them, and what do I have to do first?"
    expected_answer: "Not as-is. It's a Tier 3 external release, and all four conditions must be met: (1) facility-level aggregates only, leaving out facilities without inpatient care; (2) suppress any facility with fewer than 20 eligible index admissions and show it as 'suppressed', which applies to 3 of the 8 reporting facilities (Granite Falls, Sagebrush Regional, and Women's and Children's); (3) replace facility names with blinded codes; (4) get written approval from the Data Governance Council at dgc@junipervalley.example, allowing 10 business days. Send the certified figure calculated per the Metrics Glossary. A BAA does not authorize the release, and the threshold is stricter than the HHS convention of 11."
    source: knowledge/docs/External_Data_Release_Policy.md

  - id: q6
    kind: needs_definition
    question: "What's the Experience Score at each facility?"
    expected_answer: "The Experience Score is the average overall_rating times 10, on a 0 to 100 scale; 83.6 system-wide. Highest to lowest: Summit Orthopedic Hospital 91.9, Willow Creek Hospital 90.8, Cedar Ridge Hospital 88.6, Juniper Valley Women's and Children's Hospital 85.7, Northgate Family Clinic 84.8, Pinehurst Clinic 83.9, Lakeside Clinic 81.1, Mesa Primary Care 80.9, Juniper Valley Medical Center 80.8, Riverbend Community Hospital 79.3, Granite Falls Hospital 78.3, Sagebrush Regional Hospital 76.2. Reporting the raw 1 to 10 average (8.36 system-wide) is wrong."
    source: knowledge/docs/Metrics_Glossary.md

  - id: q7
    kind: needs_definition
    question: "Which facilities are closest to earning BEACON?"
    expected_answer: "The two that pass two of the three criteria: Cedar Ridge Hospital, which misses only readmission (9.2% against a limit below 8%), and Willow Creek Hospital, which misses only denial rate (23.0% against a limit below 4%). Meeting two of three is not a partial designation."
    source: knowledge/docs/BEACON_Facility_Designation.md

  - id: q8
    kind: needs_definition
    question: "Why isn't Northgate Family Clinic on the BEACON scorecard?"
    expected_answer: "BEACON evaluates only facilities that provide inpatient care, meaning at least one eligible index admission. Northgate Family Clinic is a clinic with no inpatient encounters, so it isn't evaluated, regardless of its Experience Score of 84.8."
    source: knowledge/docs/BEACON_Facility_Designation.md

  - id: q9
    kind: needs_definition
    question: "What's the Tailwind rate at each facility?"
    expected_answer: "Only the five ACO facilities are in scope. Lowest to highest: Northgate Family Clinic 75.0% (195 of 260), Summit Orthopedic Hospital 76.7% (115 of 150), Cedar Ridge Hospital 78.0% (284 of 364), Juniper Valley Medical Center 79.8% (340 of 426), Willow Creek Hospital 80.3% (241 of 300). Willow Creek is the only facility at the 80% target. Non-ACO facilities are not part of Tailwind and shouldn't be listed."
    source: knowledge/docs/Project_Tailwind.md

  - id: q10
    kind: needs_definition
    question: "Which facilities are above the CMS 18% readmission penalty threshold?"
    expected_answer: "None. Using the house 30-Day Readmission Rate, the highest is Granite Falls Hospital at 16.7% (3 of 18 eligible index admissions). Counting unplanned readmissions within 30 days over all inpatient encounters, with no exclusions, wrongly puts four facilities over 18%, including Juniper Valley Women's and Children's Hospital at about 31%, because it counts pediatric and obstetric admissions the definition excludes."
    source: knowledge/docs/Metrics_Glossary.md

  - id: q11
    kind: needs_definition
    question: "Which facility has the highest 30-day readmission rate?"
    expected_answer: "Granite Falls Hospital at 16.7% (3 of 18 eligible index admissions), then Riverbend Community Hospital at 15.5% (17 of 110). Granite Falls rests on fewer than 20 eligible index admissions, so it would be suppressed in any external release. Juniper Valley Women's and Children's Hospital comes out highest only if pediatric and obstetric admissions are wrongly counted."
    source: knowledge/docs/Metrics_Glossary.md

  - id: q12
    kind: needs_definition
    question: "A partner says any facility with at least 11 admissions is fine to report. Is that our small-cell threshold?"
    expected_answer: "No. Juniper Valley Health suppresses any facility whose metric rests on fewer than 20 eligible index admissions, which is deliberately stricter than the HHS convention of 11. A suppressed value is shown as the word 'suppressed', not as zero or a blank."
    source: knowledge/docs/External_Data_Release_Policy.md

  - id: q13
    kind: needs_definition
    question: "We have a BAA with this benchmarking partner. Does that cover sending them our readmission data?"
    expected_answer: "No. A BAA permits the relationship but doesn't approve any specific release or replace Data Governance Council approval. Any release outside Juniper Valley Health is Tier 3 and needs written approval from the Data Governance Council, even with a contract, data use agreement, or BAA in place."
    source: knowledge/docs/External_Data_Release_Policy.md

  - id: q14
    kind: needs_definition
    question: "How do I get approval for an external data release, and how long does it take?"
    expected_answer: "Email the Data Governance Council at dgc@junipervalley.example with the request, the recipient, the fields, and a sample of the output. Allow 10 business days from a complete request. Written approval is required before anything is sent, and each release needs its own approval, even if it repeats an earlier one."
    source: knowledge/docs/External_Data_Release_Policy.md
